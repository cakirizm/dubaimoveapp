name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Dubai Move brand assets
        run: |
          swift scripts/generate_brand_assets.swift
          file ios/DubaiMove/Assets.xcassets/AppIcon.appiconset/AppIcon1024.png
          file ios/DubaiMove/Assets.xcassets/BrandLogo.imageset/BrandLogo.png
          file ios/DubaiMove/Assets.xcassets/BrandWelcome.imageset/BrandWelcome.png
      - name: Build DubaiMove
        run: |
          xcodebuild \
            -project ios/DubaiMove.xcodeproj \
            -scheme DubaiMove \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
